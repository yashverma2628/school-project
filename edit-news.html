<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School News Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ============================================================================ */
        /* GLOBAL STYLES */
        /* ============================================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* ============================================================================ */
        /* HEADER STYLES */
        /* ============================================================================ */
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        
        /* ============================================================================ */
        /* AUTHENTICATION STYLES */
        /* ============================================================================ */
        
        .auth-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .auth-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .auth-form {
            display: flex;
            gap: 15px;
            align-items: end;
            flex-wrap: wrap;
        }
        
        .input-group {
            flex: 1;
            min-width: 300px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        /* ============================================================================ */
        /* BUTTON STYLES */
        /* ============================================================================ */
        
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #3498db, #2980b9);
        }
        
        .btn-success {
            background: linear-gradient(45deg, #27ae60, #219a52);
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
        }
        
        /* ============================================================================ */
        /* MAIN CONTENT STYLES */
        /* ============================================================================ */
        
        .main-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        /* ============================================================================ */
        /* TABS STYLES */
        /* ============================================================================ */
        
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .tab-btn:hover {
            background: #e9ecef;
            color: #495057;
        }
        
        .tab-btn.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        
        .tab-content {
            display: none;
            padding: 30px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* ============================================================================ */
        /* FORM STYLES */
        /* ============================================================================ */
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-row {
            display: flex;
            gap: 20px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        
        /* ============================================================================ */
        /* NEWS LIST STYLES */
        /* ============================================================================ */
        
        .news-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f8c8d;
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .filter-group select {
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }
        
        .news-item {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #3498db;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        
        .news-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .news-item.urgent {
            border-left-color: #e74c3c;
            background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
        }
        
        .news-item.academic {
            border-left-color: #f39c12;
        }
        
        .news-item.events {
            border-left-color: #27ae60;
        }
        
        .news-item.announcements {
            border-left-color: #9b59b6;
        }
        
        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .news-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .news-meta {
            display: flex;
            gap: 20px;
            color: #7f8c8d;
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .news-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .urgent-badge {
            background: #e74c3c;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .news-actions {
            display: flex;
            gap: 10px;
        }
        
        .news-content {
            color: #34495e;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .news-content p {
            margin-bottom: 10px;
        }
        
        .news-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .tag {
            background: #ecf0f1;
            color: #2c3e50;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .no-news {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
        
        .no-news i {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .no-news p {
            font-size: 1.2em;
        }
        
        /* ============================================================================ */
        /* STATS STYLES */
        /* ============================================================================ */
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border-left: 5px solid #3498db;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .stat-card.total {
            border-left-color: #3498db;
        }
        
        .stat-card.urgent {
            border-left-color: #e74c3c;
        }
        
        .stat-card.academic {
            border-left-color: #f39c12;
        }
        
        .stat-card.events {
            border-left-color: #27ae60;
        }
        
        .stat-card.announcements {
            border-left-color: #9b59b6;
        }
        
        .stat-card i {
            font-size: 2.5em;
            margin-bottom: 15px;
            opacity: 0.7;
        }
        
        .stat-number {
            display: block;
            font-size: 2.5em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #7f8c8d;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }
        
        /* ============================================================================ */
        /* MODAL STYLES */
        /* ============================================================================ */
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 20px 30px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 {
            margin: 0;
            font-size: 1.3em;
        }
        
        .close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        
        .close:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .modal-body {
            padding: 30px;
        }
        
        /* ============================================================================ */
        /* STATUS AND LOADING STYLES */
        /* ============================================================================ */
        
        .status-message {
            display: none;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading-indicator {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #2c3e50;
            font-size: 18px;
            font-weight: 600;
        }
        
        /* ============================================================================ */
        /* RESPONSIVE DESIGN */
        /* ============================================================================ */
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .auth-form {
                flex-direction: column;
            }
            
            .input-group {
                min-width: 100%;
            }
            
            .form-row {
                flex-direction: column;
            }
            
            .news-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .news-actions {
                width: 100%;
                justify-content: flex-end;
            }
            
            .news-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                min-width: 100%;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
            
            .tab-btn {
                min-width: 120px;
                padding: 15px;
                font-size: 14px;
            }
            
            .modal-content {
                width: 95%;
                margin: 10% auto;
            }
            
            .modal-body {
                padding: 20px;
            }
        }
        
        /* ============================================================================ */
        /* UTILITY STYLES */
        /* ============================================================================ */
        
        .text-center {
            text-align: center;
        }
        
        .mb-20 {
            margin-bottom: 20px;
        }
        
        .mt-20 {
            margin-top: 20px;
        }
        
        .hidden {
            display: none;
        }
        
        /* ============================================================================ */
        /* ANIMATION STYLES */
        /* ============================================================================ */
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .news-item {
            animation: fadeIn 0.5s ease-out;
        }
        
        .stat-card {
            animation: fadeIn 0.5s ease-out;
        }
        
        /* ============================================================================ */
        /* CUSTOM SCROLLBAR */
        /* ============================================================================ */
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator">
        <div class="spinner"></div>
        <div class="loading-text">Processing...</div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-newspaper"></i> School News Manager</h1>
            <p>Manage and publish school news articles with GitHub integration</p>
        </div>

        <!-- Status Message -->
        <div id="statusMessage" class="status-message"></div>

        <!-- GitHub Authentication Section -->
        <div class="auth-section">
            <h2><i class="fab fa-github"></i> GitHub Authentication</h2>
            <div class="auth-form">
                <div class="input-group">
                    <label for="githubToken">GitHub Personal Access Token</label>
                    <input type="password" id="githubToken" placeholder="Enter your GitHub token with repo permissions">
                </div>
                <button onclick="authenticateGitHub()" class="btn">
                    <i class="fas fa-key"></i> Connect to GitHub
                </button>
            </div>
        </div>

        <!-- Main Content (Hidden until authenticated) -->
        <div id="mainContent" class="main-content" style="display: none;">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('add')">
                    <i class="fas fa-plus"></i> Add News
                </button>
                <button class="tab-btn" onclick="switchTab('manage')">
                    <i class="fas fa-list"></i> Manage News
                </button>
                <button class="tab-btn" onclick="switchTab('stats')">
                    <i class="fas fa-chart-bar"></i> Statistics
                </button>
            </div>

            <!-- Add News Tab -->
            <div id="addTab" class="tab-content active">
                <h2 style="margin-bottom: 25px; color: #2c3e50;">
                    <i class="fas fa-plus-circle"></i> Add New Article
                </h2>
                
                <form id="newsForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newsTitle">Title *</label>
                            <input type="text" id="newsTitle" required placeholder="Enter news title">
                        </div>
                        <div class="form-group">
                            <label for="newsCategory">Category *</label>
                            <select id="newsCategory" required>
                                <option value="">Select category</option>
                                <option value="academic">Academic</option>
                                <option value="events">Events</option>
                                <option value="announcements">Announcements</option>
                                <option value="sports">Sports</option>
                                <option value="general">General</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newsDate">Date *</label>
                            <input type="date" id="newsDate" required>
                        </div>
                        <div class="form-group">
                            <label for="newsTags">Tags (comma-separated)</label>
                            <input type="text" id="newsTags" placeholder="e.g., important, deadline, exam">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="newsContent">Content *</label>
                        <textarea id="newsContent" required placeholder="Enter the news content. Use line breaks to separate paragraphs."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="isUrgent">
                            <label for="isUrgent">Mark as urgent</label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Add News Article
                    </button>
                </form>
            </div>

            <!-- Manage News Tab -->
            <div id="manageTab" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
                    <h2 style="color: #2c3e50; margin: 0;">
                        <i class="fas fa-cog"></i> Manage News Articles
                    </h2>
                    <button onclick="refreshNews()" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                
                <!-- Search and Filter Controls -->
                <div class="news-controls">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchBox" placeholder="Search news articles..." onkeyup="searchNews()">
                    </div>
                    <div class="filter-group">
                        <select id="categoryFilter" onchange="filterNews()">
                            <option value="">All Categories</option>
                            <option value="academic">Academic</option>
                            <option value="events">Events</option>
                            <option value="announcements">Announcements</option>
                            <option value="sports">Sports</option>
                            <option value="general">General</option>
                        </select>
                    </div>
                </div>
                
                <!-- News List -->
                <div id="newsList">
                    <!-- News items will be rendered here by JavaScript -->
                </div>
            </div>

            <!-- Statistics Tab -->
            <div id="statsTab" class="tab-content">
                <h2 style="margin-bottom: 25px; color: #2c3e50;">
                    <i class="fas fa-chart-pie"></i> News Statistics
                </h2>
                
                <div id="statsGrid" class="stats-grid">
                    <!-- Stats will be rendered here by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Edit News Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> Edit News Article</h3>
                <button class="close" onclick="closeEditModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editNewsId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editTitle">Title *</label>
                            <input type="text" id="editTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="editCategory">Category *</label>
                            <select id="editCategory" required>
                                <option value="">Select category</option>
                                <option value="academic">Academic</option>
                                <option value="events">Events</option>
                                <option value="announcements">Announcements</option>
                                <option value="sports">Sports</option>
                                <option value="general">General</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editDate">Date *</label>
                            <input type="date" id="editDate" required>
                        </div>
                        <div class="form-group">
                            <label for="editTags">Tags (comma-separated)</label>
                            <input type="text" id="editTags" placeholder="e.g., important, deadline, exam">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="editContent">Content *</label>
                        <textarea id="editContent" required placeholder="Enter the news content. Use line breaks to separate paragraphs."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="editIsUrgent">
                            <label for="editIsUrgent">Mark as urgent</label>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 25px;">
                        <button type="button" onclick="closeEditModal()" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Update Article
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>   
    <script>
      // ============================================================================
    // SCHOOL NEWS MANAGER - JAVASCRIPT
  // ============================================================================

// Global variables
let githubToken = '';
let newsData = [];
let currentEditIndex = -1;
let originalNewsData = [];

// GitHub configuration
const githubConfig = {
    owner: 'yashverma2628',
    repo: 'school-project',
    branch: 'main',
    dataFile: 'news.json'
};

// ============================================================================
// INITIALIZATION
// ============================================================================

document.addEventListener('DOMContentLoaded', function() {
    // Set default date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('newsDate').value = today;
    document.getElementById('editDate').value = today;
    
    // Add form event listeners
    document.getElementById('newsForm').addEventListener('submit', handleAddNews);
    document.getElementById('editForm').addEventListener('submit', handleUpdateNews);
    
    // Close modal when clicking outside
    window.addEventListener('click', function(event) {
        const modal = document.getElementById('editModal');
        if (event.target === modal) {
            closeEditModal();
        }
    });
});

// ============================================================================
// GITHUB AUTHENTICATION
// ============================================================================

async function authenticateGitHub() {
    const token = document.getElementById('githubToken').value.trim();
    
    if (!token) {
        showStatus('Please enter your GitHub Personal Access Token', 'error');
        return;
    }

    showLoading(true);
    githubToken = token;
    
    try {
        // Test the token by accessing the repository
        const response = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}`, {
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });

        if (response.ok) {
            showStatus('✅ Successfully connected to GitHub repository!', 'success');
            document.getElementById('mainContent').style.display = 'block';
            await loadNewsData();
        } else {
            throw new Error('Invalid token or repository access denied. Check your token permissions.');
        }
    } catch (error) {
        showStatus('❌ Authentication failed: ' + error.message, 'error');
        console.error('GitHub auth error:', error);
    } finally {
        showLoading(false);
    }
}

// ============================================================================
// GITHUB DATA MANAGEMENT
// ============================================================================

async function loadNewsData() {
    try {
        showLoading(true);
        
        const response = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.dataFile}`, {
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });

        if (response.ok) {
            const data = await response.json();
            const content = atob(data.content);
            const jsonData = JSON.parse(content);
            newsData = jsonData.news || [];
            originalNewsData = JSON.parse(JSON.stringify(newsData)); // Deep copy
            console.log('Loaded news data:', newsData.length, 'articles');
            showStatus('✅ News data loaded successfully from GitHub!', 'success');
        } else if (response.status === 404) {
            // File doesn't exist, initialize with empty data
            console.log('News file not found, initializing...');
            await initializeNewsData();
        } else {
            throw new Error(`GitHub API error: ${response.status} ${response.statusText}`);
        }
        
        renderNews();
        renderStats();
        
    } catch (error) {
        console.error('Error loading news data:', error);
        showStatus('Error loading news data: ' + error.message, 'error');
        // Initialize with empty data on error
        newsData = [];
        renderNews();
        renderStats();
    } finally {
        showLoading(false);
    }
}

async function initializeNewsData() {
    // Initialize with sample data if no data exists
    newsData = [
        {
            id: 1,
            title: "Welcome to School News Manager",
            category: "announcements",
            date: new Date().toISOString().split('T')[0],
            isUrgent: false,
            content: [
                "Welcome to the School News Management System! This is your first news article.",
                "",
                "You can now add, edit, and manage news articles directly from this interface. All changes will be saved to your GitHub repository automatically."
            ],
            tags: ["Welcome", "System"]
        }
    ];
    
    await saveNewsData();
    showStatus('✅ Initialized with sample data', 'success');
}

async function saveNewsData() {
    try {
        showLoading(true);
        
        // Prepare the JSON content
        const jsonContent = JSON.stringify({ news: newsData }, null, 2);
        const encodedContent = btoa(jsonContent);
        
        // Check if file exists to get the SHA
        let sha = null;
        const checkResponse = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.dataFile}`, {
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });
        
        if (checkResponse.ok) {
            const fileData = await checkResponse.json();
            sha = fileData.sha;
        }
        
        // Save to GitHub
        const saveData = {
            message: `Update news data - ${new Date().toLocaleString()}`,
            content: encodedContent,
            branch: githubConfig.branch
        };
        
        if (sha) {
            saveData.sha = sha;
        }
        
        const saveResponse = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.dataFile}`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(saveData)
        });
        
        if (saveResponse.ok) {
            originalNewsData = JSON.parse(JSON.stringify(newsData)); // Update original copy
            showStatus('✅ News data saved to GitHub successfully!', 'success');
            return true;
        } else {
            const errorData = await saveResponse.json();
            throw new Error(errorData.message || 'Failed to save to GitHub');
        }
        
    } catch (error) {
        console.error('Error saving news data:', error);
        showStatus('❌ Error saving to GitHub: ' + error.message, 'error');
        return false;
    } finally {
        showLoading(false);
    }
}

async function syncToGitHub() {
    await saveNewsData();
}

// ============================================================================
// NEWS MANAGEMENT FUNCTIONS
// ============================================================================

// ============================================================================
// NEWS MANAGEMENT FUNCTIONS
// ============================================================================

async function handleAddNews(e) {
    e.preventDefault();
    
    const title = document.getElementById('newsTitle').value.trim();
    const category = document.getElementById('newsCategory').value;
    const contentText = document.getElementById('newsContent').value.trim();
    const tags = document.getElementById('newsTags').value.trim();
    const date = document.getElementById('newsDate').value || new Date().toISOString().split('T')[0];
    const isUrgent = document.getElementById('isUrgent').checked;
    
    if (!title || !category || !contentText) {
        showStatus('Please fill in all required fields', 'error');
        return;
    }
    
    // Process content into paragraphs
    const content = contentText.split('\n').map(line => line.trim());
    
    // Process tags
    const tagArray = tags ? tags.split(',').map(tag => tag.trim()).filter(tag => tag) : [];
    
    // Generate new ID
    const newId = newsData.length > 0 ? Math.max(...newsData.map(n => n.id)) + 1 : 1;
    
    // Create new news object
    const newNews = {
        id: newId,
        title,
        category,
        date,
        isUrgent,
        content,
        tags: tagArray
    };
    
    // Add to array
    newsData.unshift(newNews); // Add to beginning
    
    // Save to GitHub
    const success = await saveNewsData();
    if (success) {
        // Reset form
        document.getElementById('newsForm').reset();
        document.getElementById('newsDate').value = new Date().toISOString().split('T')[0];
        
        // Switch to manage tab and refresh
        switchTab('manage');
        renderNews();
        renderStats();
        
        showStatus('✅ News article added successfully!', 'success');
    }
}

async function handleUpdateNews(e) {
    e.preventDefault();
    
    const id = parseInt(document.getElementById('editNewsId').value);
    const title = document.getElementById('editTitle').value.trim();
    const category = document.getElementById('editCategory').value;
    const contentText = document.getElementById('editContent').value.trim();
    const tags = document.getElementById('editTags').value.trim();
    const date = document.getElementById('editDate').value;
    const isUrgent = document.getElementById('editIsUrgent').checked;
    
    if (!title || !category || !contentText) {
        showStatus('Please fill in all required fields', 'error');
        return;
    }
    
    // Find the news item
    const newsIndex = newsData.findIndex(n => n.id === id);
    if (newsIndex === -1) {
        showStatus('News article not found', 'error');
        return;
    }
    
    // Process content into paragraphs
    const content = contentText.split('\n').map(line => line.trim());
    
    // Process tags
    const tagArray = tags ? tags.split(',').map(tag => tag.trim()).filter(tag => tag) : [];
    
    // Update the news object
    newsData[newsIndex] = {
        ...newsData[newsIndex],
        title,
        category,
        date,
        isUrgent,
        content,
        tags: tagArray
    };
    
    // Save to GitHub
    const success = await saveNewsData();
    if (success) {
        closeEditModal();
        renderNews();
        renderStats();
        showStatus('✅ News article updated successfully!', 'success');
    }
}

async function deleteNews(id) {
    if (!confirm('Are you sure you want to delete this news article? This action cannot be undone.')) {
        return;
    }
    
    const initialLength = newsData.length;
    newsData = newsData.filter(news => news.id !== id);
    
    if (newsData.length < initialLength) {
        const success = await saveNewsData();
        if (success) {
            renderNews();
            renderStats();
            showStatus('✅ News article deleted successfully!', 'success');
        }
    } else {
        showStatus('News article not found', 'error');
    }
}

function editNews(id) {
    const news = newsData.find(n => n.id === id);
    if (!news) {
        showStatus('News article not found', 'error');
        return;
    }
    
    // Populate edit form
    document.getElementById('editNewsId').value = news.id;
    document.getElementById('editTitle').value = news.title;
    document.getElementById('editCategory').value = news.category;
    document.getElementById('editContent').value = news.content.join('\n');
    document.getElementById('editTags').value = news.tags ? news.tags.join(', ') : '';
    document.getElementById('editDate').value = news.date;
    document.getElementById('editIsUrgent').checked = news.isUrgent;
    
    // Show modal
    document.getElementById('editModal').style.display = 'block';
}

function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
    document.getElementById('editForm').reset();
}

// ============================================================================
// UI MANAGEMENT FUNCTIONS
// ============================================================================

function switchTab(tabName) {
    // Update tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick="switchTab('${tabName}')"]`).classList.add('active');
    
    // Update tab content
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById(tabName + 'Tab').classList.add('active');
    
    // Refresh data if switching to manage or stats tab
    if (tabName === 'manage') {
        renderNews();
    } else if (tabName === 'stats') {
        renderStats();
    }
}

function renderNews() {
    const newsList = document.getElementById('newsList');
    const filteredNews = getFilteredNews();
    
    if (filteredNews.length === 0) {
        newsList.innerHTML = `
            <div class="no-news">
                <i class="fas fa-newspaper"></i>
                <p>No news articles found</p>
            </div>
        `;
        return;
    }
    
    newsList.innerHTML = filteredNews.map(news => `
        <div class="news-item ${news.category} ${news.isUrgent ? 'urgent' : ''}">
            <div class="news-header">
                <div>
                    <div class="news-title">${news.title}</div>
                    <div class="news-meta">
                        <span><i class="fas fa-calendar"></i> ${formatDate(news.date)}</span>
                        <span><i class="fas fa-folder"></i> ${news.category.charAt(0).toUpperCase() + news.category.slice(1)}</span>
                        ${news.isUrgent ? '<span class="urgent-badge">URGENT</span>' : ''}
                    </div>
                </div>
                <div class="news-actions">
                    <button onclick="editNews(${news.id})" class="btn btn-primary" style="padding: 8px 12px; font-size: 14px;">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button onclick="deleteNews(${news.id})" class="btn btn-danger" style="padding: 8px 12px; font-size: 14px;">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
            <div class="news-content">
                ${news.content.map(paragraph => paragraph.trim() === '' ? '<br>' : `<p style="margin: 0 0 10px 0;">${paragraph}</p>`).join('')}
            </div>
            ${news.tags && news.tags.length > 0 ? `
                <div class="news-tags">
                    ${news.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>
            ` : ''}
        </div>
    `).join('');
}

function renderStats() {
    const statsGrid = document.getElementById('statsGrid');
    
    const total = newsData.length;
    const urgent = newsData.filter(n => n.isUrgent).length;
    const academic = newsData.filter(n => n.category === 'academic').length;
    const events = newsData.filter(n => n.category === 'events').length;
    const announcements = newsData.filter(n => n.category === 'announcements' || n.category === 'announcement').length;
    
    statsGrid.innerHTML = `
        <div class="stat-card total">
            <i class="fas fa-newspaper"></i>
            <span class="stat-number">${total}</span>
            <span class="stat-label">Total Articles</span>
        </div>
        <div class="stat-card urgent">
            <i class="fas fa-exclamation-triangle"></i>
            <span class="stat-number">${urgent}</span>
            <span class="stat-label">Urgent News</span>
        </div>
        <div class="stat-card academic">
            <i class="fas fa-graduation-cap"></i>
            <span class="stat-number">${academic}</span>
            <span class="stat-label">Academic</span>
        </div>
        <div class="stat-card events">
            <i class="fas fa-calendar-alt"></i>
            <span class="stat-number">${events}</span>
            <span class="stat-label">Events</span>
        </div>
        <div class="stat-card announcements">
            <i class="fas fa-bullhorn"></i>
            <span class="stat-number">${announcements}</span>
            <span class="stat-label">Announcements</span>
        </div>
    `;
}

function getFilteredNews() {
    let filtered = [...newsData];
    
    // Filter by category
    const categoryFilter = document.getElementById('categoryFilter').value;
    if (categoryFilter) {
        filtered = filtered.filter(news => news.category === categoryFilter);
    }
    
    // Filter by search term
    const searchTerm = document.getElementById('searchBox').value.toLowerCase().trim();
    if (searchTerm) {
        filtered = filtered.filter(news => 
            news.title.toLowerCase().includes(searchTerm) ||
            news.content.join(' ').toLowerCase().includes(searchTerm) ||
            (news.tags && news.tags.some(tag => tag.toLowerCase().includes(searchTerm)))
        );
    }
    
    // Sort by date (newest first) and urgent items first
    filtered.sort((a, b) => {
        if (a.isUrgent && !b.isUrgent) return -1;
        if (!a.isUrgent && b.isUrgent) return 1;
        return new Date(b.date) - new Date(a.date);
    });
    
    return filtered;
}

function filterNews() {
    renderNews();
}

function searchNews() {
    renderNews();
}

async function refreshNews() {
    await loadNewsData();
    showStatus('✅ News data refreshed from GitHub!', 'success');
}

// ============================================================================
// UTILITY FUNCTIONS
// ============================================================================

function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
    });
}

function showStatus(message, type) {
    const statusEl = document.getElementById('statusMessage');
    statusEl.textContent = message;
    statusEl.className = `status-message ${type}`;
    statusEl.style.display = 'block';
    
    // Auto-hide after 5 seconds
    setTimeout(() => {
        statusEl.style.display = 'none';
    }, 5000);
}

function showLoading(show) {
    document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
}

// ============================================================================
// EVENT HANDLERS
// ============================================================================

// Handle Enter key in search box
document.addEventListener('DOMContentLoaded', function() {
    const searchBox = document.getElementById('searchBox');
    if (searchBox) {
        searchBox.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                searchNews();
            }
        });
    }
});    </script>
