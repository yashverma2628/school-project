<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School News Editor & Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #718096;
            font-size: 1.1rem;
        }

        .auth-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .auth-section h2 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f56565, #e53e3e);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #a0aec0, #718096);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .main-content {
            display: none;
        }

        .management-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            flex: 1;
            padding: 15px 20px;
            background: transparent;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #4a5568;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tab-pane {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .tab-pane h2 {
            color: #4a5568;
            margin-bottom: 25px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .filter-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding-right: 40px;
            width: 250px;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        .action-controls {
            display: flex;
            gap: 10px;
        }

        .news-item {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-left: 4px solid #e2e8f0;
        }

        .news-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .news-item.urgent {
            border-left-color: #f56565;
            background: linear-gradient(135deg, #fff5f5, #ffffff);
        }

        .news-item.academic {
            border-left-color: #4299e1;
        }

        .news-item.events {
            border-left-color: #48bb78;
        }

        .news-item.announcements {
            border-left-color: #ed8936;
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .news-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .news-meta {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 10px;
        }

        .news-content {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .news-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tag {
            background: #edf2f7;
            color: #4a5568;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .urgent-badge {
            background: linear-gradient(135deg, #f56565, #e53e3e);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .news-actions {
            display: flex;
            gap: 10px;
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }

        .status-message.success {
            background: #c6f6d5;
            color: #276749;
            border: 1px solid #9ae6b4;
        }

        .status-message.error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #feb2b2;
        }

        .loading-indicator {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .loading-indicator div {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: #4a5568;
        }

        .loading-indicator i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
            color: #667eea;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .modal-title {
            color: #4a5568;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close {
            color: #a0aec0;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #4a5568;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-card.total i { color: #667eea; }
        .stat-card.urgent i { color: #f56565; }
        .stat-card.academic i { color: #4299e1; }
        .stat-card.events i { color: #48bb78; }
        .stat-card.announcements i { color: #ed8936; }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3748;
            display: block;
        }

        .stat-label {
            color: #718096;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .no-news {
            text-align: center;
            padding: 50px;
            color: #a0aec0;
            font-size: 1.2rem;
        }

        .no-news i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #e2e8f0;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .category-filter {
            min-width: 150px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-controls {
                flex-direction: column;
                gap: 10px;
            }
            
            .search-box input {
                width: 100%;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .management-tabs {
                flex-direction: column;
            }
        }

        .file-upload {
            border: 2px dashed #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .file-upload input {
            display: none;
        }

        .file-upload label {
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-newspaper"></i> School News Manager</h1>
            <p>Create, edit, and manage school news articles</p>
        </div>

        <!-- File Upload Section -->
        <div class="auth-section">
            <h2><i class="fas fa-upload"></i> Load News Data</h2>
            <div class="file-upload">
                <input type="file" id="jsonFile" accept=".json" onchange="loadJSONFile(event)">
                <label for="jsonFile">
                    <i class="fas fa-cloud-upload-alt"></i>
                    Click here to upload your news.json file
                </label>
                <p style="margin-top: 10px; color: #718096; font-size: 0.9rem;">
                    Upload your existing news.json file to load and manage your school news
                </p>
            </div>
            
            <div style="text-align: center; margin: 15px 0;">
                <span style="color: #a0aec0;">or</span>
            </div>
            
            <button onclick="loadSampleData()" class="btn btn-secondary">
                <i class="fas fa-database"></i> Load Sample Data
            </button>
        </div>

        <!-- Status Message -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator">
            <div>
                <i class="fas fa-spinner"></i>
                <p style="margin-top: 15px;">Processing...</p>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent" class="main-content">
            <!-- Management Tabs -->
            <div class="management-tabs">
                <button class="tab-btn active" onclick="switchTab('add')">
                    <i class="fas fa-plus"></i> Add News
                </button>
                <button class="tab-btn" onclick="switchTab('manage')">
                    <i class="fas fa-list"></i> Manage News
                </button>
                <button class="tab-btn" onclick="switchTab('stats')">
                    <i class="fas fa-chart-bar"></i> Statistics
                </button>
            </div>

            <!-- Add News Tab -->
            <div class="tab-content active" id="addTab">
                <div class="tab-pane">
                    <h2><i class="fas fa-plus-circle"></i> Add New Article</h2>
                    <form id="newsForm" class="news-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="newsTitle">Title *</label>
                                <input type="text" id="newsTitle" class="form-control" required 
                                       placeholder="Enter news title">
                            </div>
                            <div class="form-group">
                                <label for="newsCategory">Category *</label>
                                <select id="newsCategory" class="form-control" required>
                                    <option value="">Select Category</option>
                                    <option value="urgent">Urgent</option>
                                    <option value="academic">Academic</option>
                                    <option value="events">Events</option>
                                    <option value="announcements">Announcements</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="newsContent">Content *</label>
                            <textarea id="newsContent" class="form-control" required rows="6" 
                                      placeholder="Enter the news content (separate paragraphs with empty lines)"></textarea>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="newsTags">Tags (comma-separated)</label>
                                <input type="text" id="newsTags" class="form-control" 
                                       placeholder="e.g., Important, Schedule, Competition">
                            </div>
                            <div class="form-group">
                                <label for="newsDate">Publication Date</label>
                                <input type="date" id="newsDate" class="form-control">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="isUrgent"> Mark as Urgent
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Add News Article
                        </button>
                    </form>
                </div>
            </div>

            <!-- Manage News Tab -->
            <div class="tab-content" id="manageTab">
                <div class="tab-pane">
                    <h2><i class="fas fa-cog"></i> Manage News Articles</h2>
                    
                    <!-- Controls -->
                    <div class="controls">
                        <div class="filter-controls">
                            <select id="categoryFilter" class="form-control category-filter" onchange="filterNews()">
                                <option value="">All Categories</option>
                                <option value="urgent">Urgent</option>
                                <option value="academic">Academic</option>
                                <option value="events">Events</option>
                                <option value="announcements">Announcements</option>
                            </select>
                            
                            <div class="search-box">
                                <input type="text" id="searchBox" class="form-control" placeholder="Search news..." 
                                       oninput="searchNews()">
                                <i class="fas fa-search"></i>
                            </div>
                        </div>
                        
                        <div class="action-controls">
                            <button onclick="refreshNews()" class="btn btn-secondary">
                                <i class="fas fa-sync"></i> Refresh
                            </button>
                            <button onclick="exportJSON()" class="btn btn-success">
                                <i class="fas fa-download"></i> Export JSON
                            </button>
                        </div>
                    </div>
                    
                    <!-- News List -->
                    <div id="newsList" class="news-list">
                        <!-- News items will be rendered here by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Statistics Tab -->
            <div class="tab-content" id="statsTab">
                <div class="tab-pane">
                    <h2><i class="fas fa-chart-line"></i> News Statistics</h2>
                    
                    <div class="stats-grid" id="statsGrid">
                        <!-- Statistics will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">Edit News Article</h3>
                    <span class="close" onclick="closeEditModal()">&times;</span>
                </div>
                <form id="editForm">
                    <input type="hidden" id="editNewsId">
                    
                    <div class="form-group">
                        <label for="editTitle">Title *</label>
                        <input type="text" id="editTitle" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="editCategory">Category *</label>
                        <select id="editCategory" class="form-control" required>
                            <option value="urgent">Urgent</option>
                            <option value="academic">Academic</option>
                            <option value="events">Events</option>
                            <option value="announcements">Announcements</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="editContent">Content *</label>
                        <textarea id="editContent" class="form-control" required rows="6"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="editTags">Tags (comma-separated)</label>
                        <input type="text" id="editTags" class="form-control" 
                               placeholder="e.g., Important, Schedule, Competition">
                    </div>
                    
                    <div class="form-group">
                        <label for="editDate">Publication Date</label>
                        <input type="date" id="editDate" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="editIsUrgent"> Mark as Urgent
                        </label>
                    </div>
                    
                    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                        <button type="button" onclick="closeEditModal()" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Article
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
      // ============================================================================
// SCHOOL NEWS MANAGER - JAVASCRIPT
// ============================================================================

// Global variables
let githubToken = '';
let newsData = [];
let currentEditIndex = -1;
let originalNewsData = [];

// GitHub configuration
const githubConfig = {
    owner: 'yashverma2628',
    repo: 'school-project',
    branch: 'main',
    dataFile: 'news.json'
};

// ============================================================================
// INITIALIZATION
// ============================================================================

document.addEventListener('DOMContentLoaded', function() {
    // Set default date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('newsDate').value = today;
    document.getElementById('editDate').value = today;
    
    // Add form event listeners
    document.getElementById('newsForm').addEventListener('submit', handleAddNews);
    document.getElementById('editForm').addEventListener('submit', handleUpdateNews);
    
    // Close modal when clicking outside
    window.addEventListener('click', function(event) {
        const modal = document.getElementById('editModal');
        if (event.target === modal) {
            closeEditModal();
        }
    });
});

// ============================================================================
// GITHUB AUTHENTICATION
// ============================================================================

async function authenticateGitHub() {
    const token = document.getElementById('githubToken').value.trim();
    
    if (!token) {
        showStatus('Please enter your GitHub Personal Access Token', 'error');
        return;
    }

    showLoading(true);
    githubToken = token;
    
    try {
        // Test the token by accessing the repository
        const response = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}`, {
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });

        if (response.ok) {
            showStatus('✅ Successfully connected to GitHub repository!', 'success');
            document.getElementById('mainContent').style.display = 'block';
            await loadNewsData();
        } else {
            throw new Error('Invalid token or repository access denied. Check your token permissions.');
        }
    } catch (error) {
        showStatus('❌ Authentication failed: ' + error.message, 'error');
        console.error('GitHub auth error:', error);
    } finally {
        showLoading(false);
    }
}

// ============================================================================
// GITHUB DATA MANAGEMENT
// ============================================================================

async function loadNewsData() {
    try {
        showLoading(true);
        
        const response = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.dataFile}`, {
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });

        if (response.ok) {
            const data = await response.json();
            const content = atob(data.content);
            const jsonData = JSON.parse(content);
            newsData = jsonData.news || [];
            originalNewsData = JSON.parse(JSON.stringify(newsData)); // Deep copy
            console.log('Loaded news data:', newsData.length, 'articles');
            showStatus('✅ News data loaded successfully from GitHub!', 'success');
        } else if (response.status === 404) {
            // File doesn't exist, initialize with empty data
            console.log('News file not found, initializing...');
            await initializeNewsData();
        } else {
            throw new Error(`GitHub API error: ${response.status} ${response.statusText}`);
        }
        
        renderNews();
        renderStats();
        
    } catch (error) {
        console.error('Error loading news data:', error);
        showStatus('Error loading news data: ' + error.message, 'error');
        // Initialize with empty data on error
        newsData = [];
        renderNews();
        renderStats();
    } finally {
        showLoading(false);
    }
}

async function initializeNewsData() {
    // Initialize with sample data if no data exists
    newsData = [
        {
            id: 1,
            title: "Welcome to School News Manager",
            category: "announcements",
            date: new Date().toISOString().split('T')[0],
            isUrgent: false,
            content: [
                "Welcome to the School News Management System! This is your first news article.",
                "",
                "You can now add, edit, and manage news articles directly from this interface. All changes will be saved to your GitHub repository automatically."
            ],
            tags: ["Welcome", "System"]
        }
    ];
    
    await saveNewsData();
    showStatus('✅ Initialized with sample data', 'success');
}

async function saveNewsData() {
    try {
        showLoading(true);
        
        // Prepare the JSON content
        const jsonContent = JSON.stringify({ news: newsData }, null, 2);
        const encodedContent = btoa(jsonContent);
        
        // Check if file exists to get the SHA
        let sha = null;
        const checkResponse = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.dataFile}`, {
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });
        
        if (checkResponse.ok) {
            const fileData = await checkResponse.json();
            sha = fileData.sha;
        }
        
        // Save to GitHub
        const saveData = {
            message: `Update news data - ${new Date().toLocaleString()}`,
            content: encodedContent,
            branch: githubConfig.branch
        };
        
        if (sha) {
            saveData.sha = sha;
        }
        
        const saveResponse = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.dataFile}`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(saveData)
        });
        
        if (saveResponse.ok) {
            originalNewsData = JSON.parse(JSON.stringify(newsData)); // Update original copy
            showStatus('✅ News data saved to GitHub successfully!', 'success');
            return true;
        } else {
            const errorData = await saveResponse.json();
            throw new Error(errorData.message || 'Failed to save to GitHub');
        }
        
    } catch (error) {
        console.error('Error saving news data:', error);
        showStatus('❌ Error saving to GitHub: ' + error.message, 'error');
        return false;
    } finally {
        showLoading(false);
    }
}

async function syncToGitHub() {
    await saveNewsData();
}

async function handleAddNews(e) {
    e.preventDefault();
    
    const title = document.getElementById('newsTitle').value.trim();
    const category = document.getElementById('newsCategory').value;
    const contentText = document.getElementById('newsContent').value.trim();
    const tags = document.getElementById('newsTags').value.trim();
    const date = document.getElementById('newsDate').value || new Date().toISOString().split('T')[0];
    const isUrgent = document.getElementById('isUrgent').checked;
    
    if (!title || !category || !contentText) {
        showStatus('Please fill in all required fields', 'error');
        return;
    }
    
    // Process content into paragraphs
    const content = contentText.split('\n').map(line => line.trim());
    
    // Process tags
    const tagArray = tags ? tags.split(',').map(tag => tag.trim()).filter(tag => tag) : [];
    
    // Generate new ID
    const newId = newsData.length > 0 ? Math.max(...newsData.map(n => n.id)) + 1 : 1;
    
    // Create new news object
    const newNews = {
        id: newId,
        title,
        category,
        date,
        isUrgent,
        content,
        tags: tagArray
    };
    
    // Add to array
    newsData.unshift(newNews); // Add to beginning
    
    // Save to GitHub
    const success = await saveNewsData();
    if (success) {
        // Reset form
        document.getElementById('newsForm').reset();
        document.getElementById('newsDate').value = new Date().toISOString().split('T')[0];
        
        // Switch to manage tab and refresh
        switchTab('manage');
        renderNews();
        renderStats();
        
        showStatus('✅ News article added successfully!', 'success');
    }
}

async function handleUpdateNews(e) {
    e.preventDefault();
    
    const id = parseInt(document.getElementById('editNewsId').value);
    const title = document.getElementById('editTitle').value.trim();
    const category = document.getElementById('editCategory').value;
    const contentText = document.getElementById('editContent').value.trim();
    const tags = document.getElementById('editTags').value.trim();
    const date = document.getElementById('editDate').value;
    const isUrgent = document.getElementById('editIsUrgent').checked;
    
    if (!title || !category || !contentText) {
        showStatus('Please fill in all required fields', 'error');
        return;
    }
    
    // Find the news item
    const newsIndex = newsData.findIndex(n => n.id === id);
    if (newsIndex === -1) {
        showStatus('News article not found', 'error');
        return;
    }
    
    // Process content into paragraphs
    const content = contentText.split('\n').map(line => line.trim());
    
    // Process tags
    const tagArray = tags ? tags.split(',').map(tag => tag.trim()).filter(tag => tag) : [];
    
    // Update the news object
    newsData[newsIndex] = {
        ...newsData[newsIndex],
        title,
        category,
        date,
        isUrgent,
        content,
        tags: tagArray
    };
    
    // Save to GitHub
    const success = await saveNewsData();
    if (success) {
        closeEditModal();
        renderNews();
        renderStats();
        showStatus('✅ News article updated successfully!', 'success');
    }
}

async function deleteNews(id) {
    if (!confirm('Are you sure you want to delete this news article? This action cannot be undone.')) {
        return;
    }
    
    const initialLength = newsData.length;
    newsData = newsData.filter(news => news.id !== id);
    
    if (newsData.length < initialLength) {
        const success = await saveNewsData();
        if (success) {
            renderNews();
            renderStats();
            showStatus('✅ News article deleted successfully!', 'success');
        }
    } else {
        showStatus('News article not found', 'error');
    }
}

function editNews(id) {
    const news = newsData.find(n => n.id === id);
    if (!news) {
        showStatus('News article not found', 'error');
        return;
    }
    
    // Populate edit form
    document.getElementById('editNewsId').value = news.id;
    document.getElementById('editTitle').value = news.title;
    document.getElementById('editCategory').value = news.category;
    document.getElementById('editContent').value = news.content.join('\n');
    document.getElementById('editTags').value = news.tags ? news.tags.join(', ') : '';
    document.getElementById('editDate').value = news.date;
    document.getElementById('editIsUrgent').checked = news.isUrgent;
    
    // Show modal
    document.getElementById('editModal').style.display = 'block';
}

function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
    document.getElementById('editForm').reset();
}

// ============================================================================
// UI MANAGEMENT FUNCTIONS
// ============================================================================

function switchTab(tabName) {
    // Update tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick="switchTab('${tabName}')"]`).classList.add('active');
    
    // Update tab content
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById(tabName + 'Tab').classList.add('active');
    
    // Refresh data if switching to manage or stats tab
    if (tabName === 'manage') {
        renderNews();
    } else if (tabName === 'stats') {
        renderStats();
    }
}

function renderNews() {
    const newsList = document.getElementById('newsList');
    const filteredNews = getFilteredNews();
    
    if (filteredNews.length === 0) {
        newsList.innerHTML = `
            <div class="no-news">
                <i class="fas fa-newspaper"></i>
                <p>No news articles found</p>
            </div>
        `;
        return;
    }
    
    newsList.innerHTML = filteredNews.map(news => `
        <div class="news-item ${news.category} ${news.isUrgent ? 'urgent' : ''}">
            <div class="news-header">
                <div>
                    <div class="news-title">${news.title}</div>
                    <div class="news-meta">
                        <span><i class="fas fa-calendar"></i> ${formatDate(news.date)}</span>
                        <span><i class="fas fa-folder"></i> ${news.category.charAt(0).toUpperCase() + news.category.slice(1)}</span>
                        ${news.isUrgent ? '<span class="urgent-badge">URGENT</span>' : ''}
                    </div>
                </div>
                <div class="news-actions">
                    <button onclick="editNews(${news.id})" class="btn btn-primary" style="padding: 8px 12px; font-size: 14px;">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button onclick="deleteNews(${news.id})" class="btn btn-danger" style="padding: 8px 12px; font-size: 14px;">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
            <div class="news-content">
                ${news.content.map(paragraph => paragraph.trim() === '' ? '<br>' : `<p style="margin: 0 0 10px 0;">${paragraph}</p>`).join('')}
            </div>
            ${news.tags && news.tags.length > 0 ? `
                <div class="news-tags">
                    ${news.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>
            ` : ''}
        </div>
    `).join('');
}

function renderStats() {
    const statsGrid = document.getElementById('statsGrid');
    
    const total = newsData.length;
    const urgent = newsData.filter(n => n.isUrgent).length;
    const academic = newsData.filter(n => n.category === 'academic').length;
    const events = newsData.filter(n => n.category === 'events').length;
    const announcements = newsData.filter(n => n.category === 'announcements' || n.category === 'announcement').length;
    
    statsGrid.innerHTML = `
        <div class="stat-card total">
            <i class="fas fa-newspaper"></i>
            <span class="stat-number">${total}</span>
            <span class="stat-label">Total Articles</span>
        </div>
        <div class="stat-card urgent">
            <i class="fas fa-exclamation-triangle"></i>
            <span class="stat-number">${urgent}</span>
            <span class="stat-label">Urgent News</span>
        </div>
        <div class="stat-card academic">
            <i class="fas fa-graduation-cap"></i>
            <span class="stat-number">${academic}</span>
            <span class="stat-label">Academic</span>
        </div>
        <div class="stat-card events">
            <i class="fas fa-calendar-alt"></i>
            <span class="stat-number">${events}</span>
            <span class="stat-label">Events</span>
        </div>
        <div class="stat-card announcements">
            <i class="fas fa-bullhorn"></i>
            <span class="stat-number">${announcements}</span>
            <span class="stat-label">Announcements</span>
        </div>
    `;
}

function getFilteredNews() {
    let filtered = [...newsData];
    
    // Filter by category
    const categoryFilter = document.getElementById('categoryFilter').value;
    if (categoryFilter) {
        filtered = filtered.filter(news => news.category === categoryFilter);
    }
    
    // Filter by search term
    const searchTerm = document.getElementById('searchBox').value.toLowerCase().trim();
    if (searchTerm) {
        filtered = filtered.filter(news => 
            news.title.toLowerCase().includes(searchTerm) ||
            news.content.join(' ').toLowerCase().includes(searchTerm) ||
            (news.tags && news.tags.some(tag => tag.toLowerCase().includes(searchTerm)))
        );
    }
    
    // Sort by date (newest first) and urgent items first
    filtered.sort((a, b) => {
        if (a.isUrgent && !b.isUrgent) return -1;
        if (!a.isUrgent && b.isUrgent) return 1;
        return new Date(b.date) - new Date(a.date);
    });
    
    return filtered;
}

function filterNews() {
    renderNews();
}

function searchNews() {
    renderNews();
}

async function refreshNews() {
    await loadNewsData();
    showStatus('✅ News data refreshed from GitHub!', 'success');
}

function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
    });
}

function showStatus(message, type) {
    const statusEl = document.getElementById('statusMessage');
    statusEl.textContent = message;
    statusEl.className = `status-message ${type}`;
    statusEl.style.display = 'block';
    
    // Auto-hide after 5 seconds
    setTimeout(() => {
        statusEl.style.display = 'none';
    }, 5000);
}

function showLoading(show) {
    document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
}
