<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School News</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh; 
            color: #333; 
            overflow-x: hidden;
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite linear;
        }

        .shape:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            top: 60%;
            right: 10%;
            animation-delay: 7s;
        }

        .shape:nth-child(3) {
            bottom: 20%;
            left: 20%;
            animation-delay: 14s;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }
        
        .news-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            position: relative;
            z-index: 1;
        }
        
        .news-header { 
            text-align: center; 
            color: white; 
            margin-bottom: 60px; 
            position: relative;
        }
        
        .news-header h1 { 
            font-size: 3.5rem; 
            margin-bottom: 15px; 
            font-weight: 800;
            background: linear-gradient(45deg, #ffffff, #a8d8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            position: relative;
        }

        .news-header p {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .news-grid { 
            display: grid; 
            gap: 30px; 
        }

        .urgent-section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 2rem;
            color: white;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .urgent-title {
            color: #ff6b6b;
        }

        .urgent-title i {
            color: #ff4757;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .news-item { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 20px; 
            padding: 35px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
            transition: all 0.4s ease; 
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .news-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: height 0.3s ease;
        }

        .news-item:hover::before {
            height: 8px;
        }
        
        .news-item:hover { 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
        }
        
        .news-item.urgent { 
            background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(255,245,245,0.98) 100%); 
            border: 2px solid rgba(255,107,107,0.3);
            box-shadow: 0 15px 40px rgba(255,107,107,0.2);
        }

        .news-item.urgent::before {
            background: linear-gradient(90deg, #ff6b6b, #ff4757);
        }

        .news-item.urgent:hover {
            box-shadow: 0 25px 60px rgba(255,107,107,0.35);
        }
        
        .news-title { 
            font-size: 1.6rem; 
            font-weight: 700; 
            margin-bottom: 20px; 
            color: #2c3e50;
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .news-item.urgent .news-title {
            color: #c0392b;
        }
        
        .news-meta { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
            align-items: center; 
        }
        
        .news-category { 
            background: linear-gradient(45deg, #667eea, #764ba2); 
            color: white; 
            padding: 8px 16px; 
            border-radius: 25px; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .news-category.urgent-cat {
            background: linear-gradient(45deg, #ff6b6b, #ff4757);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        
        .news-date { 
            color: #7f8c8d; 
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        
        .urgent-badge { 
            background: linear-gradient(45deg, #e74c3c, #c0392b); 
            color: white; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: glow 2s ease-in-out infinite alternate;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }

        @keyframes glow {
            from { box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
            to { box-shadow: 0 4px 25px rgba(231, 76, 60, 0.7); }
        }
        
        .news-content { 
            line-height: 1.8; 
            color: #34495e; 
            margin-bottom: 20px;
            font-size: 1.05rem;
        }
        
        .news-content p { 
            margin-bottom: 18px; 
        }

        .news-content p:last-child {
            margin-bottom: 0;
        }
        
        .news-tags { 
            margin-top: 25px; 
            padding-top: 20px; 
            border-top: 2px solid rgba(52, 73, 94, 0.1); 
        }

        .tags-label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            display: block;
        }
        
        .news-tag { 
            background: linear-gradient(135deg, #f8f9fa, #e9ecef); 
            color: #495057; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            margin-right: 10px; 
            margin-bottom: 8px; 
            display: inline-block; 
            font-weight: 500;
            border: 1px solid rgba(73, 80, 87, 0.1);
            transition: all 0.3s ease;
        }

        .news-tag:hover {
            background: linear-gradient(135deg, #e9ecef, #dee2e6);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .news-header h1 { 
                font-size: 2.5rem; 
            }
            
            .news-item { 
                padding: 25px; 
            }

            .section-title {
                font-size: 1.5rem;
            }

            .news-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        .error-message {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            color: #e74c3c;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .no-news {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            margin: 50px 0;
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape">
            <i class="fas fa-graduation-cap" style="font-size: 60px;"></i>
        </div>
        <div class="shape">
            <i class="fas fa-book" style="font-size: 50px;"></i>
        </div>
        <div class="shape">
            <i class="fas fa-star" style="font-size: 40px;"></i>
        </div>
    </div>

    <div class="news-container">
        <div class="news-header">
            <h1><i class="fas fa-newspaper"></i> School News</h1>
            <p>Stay updated with the latest school announcements and events</p>
        </div>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <p>Loading latest news...</p>
        </div>

        <div id="newsContent">
            <!-- News content will be loaded here -->
        </div>
    </div>

    <script>
        async function loadNews() {
            const loadingSpinner = document.getElementById('loadingSpinner');
            const newsContent = document.getElementById('newsContent');
            
            loadingSpinner.style.display = 'block';
            
            try {
                // In a real implementation, you would fetch from news.json
                // const response = await fetch('news.json');
                // const newsData = await response.json();
                
                // For this demo, using embedded data
                const newsData = {
                    "news": [
                        {
                            "id": 1,
                            "title": "Winter Break Extended",
                            "category": "urgent",
                            "date": "6/3/2025",
                            "isUrgent": true,
                            "content": [
                                "Due to ongoing construction work in the main building, winter break has been extended by one week. Classes will resume on June 15, 2025.",
                                "",
                                "All students and parents are requested to take note of this change. The school administration apologizes for any inconvenience caused and appreciates your understanding."
                            ],
                            "tags": ["Important", "Schedule"]
                        },
                        {
                            "id": 2,
                            "title": "Emergency Parent-Teacher Meeting",
                            "category": "urgent",
                            "date": "6/4/2025",
                            "isUrgent": true,
                            "content": [
                                "An emergency parent-teacher meeting has been scheduled for June 8, 2025, at 3:00 PM in the school auditorium.",
                                "",
                                "This meeting is to discuss the recent changes in academic calendar and address parent concerns. Attendance is mandatory for all parents."
                            ],
                            "tags": ["Meeting", "Parents", "Important"]
                        },
                        {
                            "id": 3,
                            "title": "Annual Sports Day 2025",
                            "category": "events",
                            "date": "6/1/2025",
                            "isUrgent": false,
                            "content": [
                                "Our Annual Sports Day will be held on June 20, 2025, at the school grounds. This year's theme is \"Unity in Diversity\" celebrating our multicultural student body.",
                                "",
                                "Registration forms are available at the school office. Parents are cordially invited to attend and cheer for their children. Various competitions and cultural programs are planned."
                            ],
                            "tags": ["Sports", "Event", "Competition"]
                        },
                        {
                            "id": 4,
                            "title": "New Science Laboratory Inauguration",
                            "category": "academic",
                            "date": "5/28/2025",
                            "isUrgent": false,
                            "content": [
                                "We are excited to announce the inauguration of our new state-of-the-art science laboratory equipped with modern instruments and safety equipment.",
                                "",
                                "The facility will be open for students from Class 8 onwards starting next week. Special orientation sessions will be conducted for students and teachers."
                            ],
                            "tags": ["Science", "Laboratory", "Facility"]
                        },
                        {
                            "id": 5,
                            "title": "Library Digital Upgrade",
                            "category": "academic",
                            "date": "6/2/2025",
                            "isUrgent": false,
                            "content": [
                                "Our school library has been upgraded with new digital resources including e-books, online databases, and computer workstations.",
                                "",
                                "Students can now access thousands of digital books and research materials. New library cards will be issued starting next week."
                            ],
                            "tags": ["Library", "Digital", "Resources", "Technology"]
                        }
                    ]
                };
                
                setTimeout(() => {
                    renderNews(newsData);
                    loadingSpinner.style.display = 'none';
                }, 1000);
                
            } catch (error) {
                loadingSpinner.style.display = 'none';
                newsContent.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 15px;"></i>
                        <p>Unable to load news. Please check if news.json file exists and is properly formatted.</p>
                    </div>
                `;
            }
        }

        function renderNews(data) {
            const newsContent = document.getElementById('newsContent');
            
            if (!data.news || data.news.length === 0) {
                newsContent.innerHTML = '<div class="no-news">No news available at the moment.</div>';
                return;
            }

            // Separate urgent and regular news
            const urgentNews = data.news.filter(item => item.isUrgent);
            const regularNews = data.news.filter(item => !item.isUrgent);

            let html = '';

            // Render urgent news section
            if (urgentNews.length > 0) {
                html += `
                    <div class="urgent-section">
                        <h2 class="section-title urgent-title">
                            <i class="fas fa-exclamation-triangle"></i>
                            Urgent Announcements
                        </h2>
                        <div class="news-grid">
                `;
                
                urgentNews.forEach(item => {
                    html += createNewsItemHTML(item, true);
                });
                
                html += '</div></div>';
            }

            // Render regular news section
            if (regularNews.length > 0) {
                html += `
                    <div class="regular-section">
                        <h2 class="section-title">
                            <i class="fas fa-newspaper"></i>
                            Latest Updates
                        </h2>
                        <div class="news-grid">
                `;
                
                regularNews.forEach(item => {
                    html += createNewsItemHTML(item, false);
                });
                
                html += '</div></div>';
            }

            newsContent.innerHTML = html;
        }

        function createNewsItemHTML(item, isUrgent) {
            const contentHTML = item.content
                .filter(p => p.trim() !== '')
                .map(p => `<p>${p}</p>`)
                .join('');

            const tagsHTML = item.tags && item.tags.length > 0 
                ? `<div class="news-tags">
                     <span class="tags-label">Tags:</span>
                     ${item.tags.map(tag => `<span class="news-tag">${tag}</span>`).join('')}
                   </div>`
                : '';

            const urgentBadge = isUrgent ? '<span class="urgent-badge">URGENT</span>' : '';
            const categoryClass = isUrgent ? 'urgent-cat' : '';
            const itemClass = isUrgent ? 'urgent' : '';

            return `
                <article class="news-item ${itemClass}">
                    <h2 class="news-title">
                        ${isUrgent ? '<i class="fas fa-exclamation-circle"></i>' : ''}
                        ${item.title}
                    </h2>
                    <div class="news-meta">
                        <span class="news-category ${categoryClass}">${item.category}</span>
                        <span class="news-date">
                            <i class="fas fa-calendar"></i> ${item.date}
                        </span>
                        ${urgentBadge}
                    </div>
                    <div class="news-content">
                        ${contentHTML}
                    </div>
                    ${tagsHTML}
                </article>
            `;
        }

        // Load news when page loads
        document.addEventListener('DOMContentLoaded', loadNews);
    </script>
</body>
</html>
