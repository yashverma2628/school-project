<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Editor - School Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .auth-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .main-content {
            display: none;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .form-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .faculty-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .btn-info {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .faculty-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .faculty-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .faculty-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .faculty-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .faculty-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 4px solid #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .faculty-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .faculty-post {
            font-size: 1em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .faculty-details {
            text-align: left;
        }

        .faculty-subjects {
            margin-bottom: 10px;
        }

        .faculty-subjects strong {
            color: #555;
            display: block;
            margin-bottom: 5px;
        }

        .subjects-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .subject-tag {
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.8em;
        }

        .faculty-experience {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .faculty-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 1.1rem;
        }

        .controls-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-info {
            background: #cce7ff;
            color: #004085;
            border: 1px solid #b3d7ff;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .preview-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }

        .preview-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .new-item {
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .faculty-list {
                grid-template-columns: 1fr;
            }
            
            .controls-section {
                flex-direction: column;
                align-items: stretch;
            }
            
            .controls-section > div {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-chalkboard-teacher"></i> Faculty Editor</h1>
        
        <!-- Authentication Section -->
        <div id="authSection" class="auth-section">
            <h2 style="margin-bottom: 20px; color: #667eea;">
                <i class="fab fa-github"></i> Connect to GitHub Repository
            </h2>
            <div class="form-group">
                <label for="githubToken">GitHub Personal Access Token:</label>
                <input type="password" id="githubToken" placeholder="Enter your GitHub token">
                <small style="color: #666; display: block; margin-top: 5px;">
                    Need a token? <a href="https://github.com/settings/tokens" target="_blank">Create one here</a>
                </small>
            </div>
            <div class="form-group">
                <label for="githubOwner">GitHub Username/Owner:</label>
                <input type="text" id="githubOwner" placeholder="Enter repository owner" value="yashverma2628">
            </div>
            <div class="form-group">
                <label for="githubRepo">Repository Name:</label>
                <input type="text" id="githubRepo" placeholder="Enter repository name" value="school-project">
            </div>
            <button onclick="authenticateGitHub()" class="btn btn-primary">
                <i class="fas fa-link"></i> Connect to GitHub
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p>Processing...</p>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Main Content -->
        <div id="mainContent" class="main-content">
            <!-- Form Section -->
            <div class="form-section">
                <h2 style="margin-bottom: 25px; color: #667eea;">
                    <i class="fas fa-user-plus"></i> Add New Faculty Member
                </h2>
                
                <form id="addFacultyForm">
                    <div class="form-group">
                        <label for="facultyName">Full Name:</label>
                        <input type="text" id="facultyName" name="facultyName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="facultyPost">Position/Post:</label>
                        <input type="text" id="facultyPost" name="facultyPost" required placeholder="e.g., Head of Mathematics Department">
                    </div>
                    
                    <div class="form-group">
                        <label for="facultySubjects">Subjects (comma-separated):</label>
                        <textarea id="facultySubjects" name="facultySubjects" required placeholder="e.g., Mathematics, Algebra, Statistics"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="facultyExperience">Experience:</label>
                        <input type="text" id="facultyExperience" name="facultyExperience" required placeholder="e.g., 15 Years">
                    </div>
                    
                    <div class="form-group">
                        <label for="facultyImage">Image URL:</label>
                        <input type="url" id="facultyImage" name="facultyImage" placeholder="https://example.com/image.jpg">
                    </div>
                    
                    <div class="form-group">
                        <label for="facultyImageFile">Or Upload Image:</label>
                        <input type="file" id="facultyImageFile" accept="image/*">
                        <div id="filePreview" style="margin-top: 10px;"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-plus"></i> Add Faculty Member
                    </button>
                </form>
            </div>

            <!-- Faculty List Section -->
            <div class="faculty-section">
                <!-- Statistics -->
                <div class="stats-section">
                    <div class="stat-card">
                        <div class="stat-number" id="totalFaculty">0</div>
                        <div class="stat-label">Total Faculty</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalSubjects">0</div>
                        <div class="stat-label">Total Subjects</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="avgExperience">0</div>
                        <div class="stat-label">Avg Experience</div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls-section">
                    <div>
                        <button onclick="refreshFaculty()" class="btn btn-info">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                        <button onclick="showPreview()" class="btn btn-primary">
                            <i class="fas fa-eye"></i> Preview HTML
                        </button>
                        <button onclick="exportFacultyHTML()" class="btn btn-success">
                            <i class="fas fa-download"></i> Export HTML
                        </button>
                    </div>
                    <div>
                        <button onclick="sortFaculty('name')" class="btn btn-info btn-small">
                            <i class="fas fa-sort-alpha-down"></i> Sort by Name
                        </button>
                        <button onclick="sortFaculty('experience')" class="btn btn-info btn-small">
                            <i class="fas fa-sort-numeric-down"></i> Sort by Experience
                        </button>
                        <button onclick="clearAllFaculty()" class="btn btn-danger btn-small">
                            <i class="fas fa-trash-alt"></i> Clear All
                        </button>
                    </div>
                </div>

                <!-- Faculty List -->
                <h3 style="margin-bottom: 20px; color: #667eea;">
                    <i class="fas fa-users"></i> Faculty Members (<span id="facultyCount">0</span>)
                </h3>
                <div id="facultyList" class="faculty-list"></div>
            </div>
        </div>

        <!-- Preview Section -->
        <div id="previewSection" class="preview-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: #667eea;"><i class="fas fa-code"></i> HTML Preview</h3>
                <button onclick="hidePreview()" class="btn btn-danger btn-small">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
            <div id="previewContent" class="preview-content"></div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeEditModal()">&times;</span>
                <h2 style="margin-bottom: 25px; color: #667eea;">
                    <i class="fas fa-edit"></i> Edit Faculty Member
                </h2>
                
                <form id="editFacultyForm">
                    <input type="hidden" id="editFacultyIndex">
                    
                    <div class="form-group">
                        <label for="editFacultyName">Full Name:</label>
                        <input type="text" id="editFacultyName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="editFacultyPost">Position/Post:</label>
                        <input type="text" id="editFacultyPost" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="editFacultySubjects">Subjects (comma-separated):</label>
                        <textarea id="editFacultySubjects" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="editFacultyExperience">Experience:</label>
                        <input type="text" id="editFacultyExperience" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="editFacultyImage">Image URL:</label>
                        <input type="url" id="editFacultyImage">
                    </div>
                    
                    <div class="form-group">
                        <label for="editFacultyImageFile">Or Upload New Image:</label>
                        <input type="file" id="editFacultyImageFile" accept="image/*">
                        <div id="editImagePreview" style="margin-top: 10px;"></div>
                    </div>
                    
                    <div style="display: flex; gap: 15px; margin-top: 25px;">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Update Faculty
                        </button>
                        <button type="button" onclick="closeEditModal()" class="btn btn-danger">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div style="text-align: center; margin-top: 50px; color: rgba(255,255,255,0.8);">
            <p id="lastUpdated">Last updated: Never</p>
        </div>
    </div>

    <script>
        // Faculty Editor JavaScript
        // Global variables
        let githubToken = '';
        let githubRepo = '';
        let githubOwner = '';
        let facultyData = [];
        let repoFileSha = '';

        // GitHub API configuration
        const GITHUB_API_BASE = 'https://api.github.com';
        const FACULTY_FILE_PATH = 'faculty.json';

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadFromLocalStorage();
        });

        // Setup all event listeners
        function setupEventListeners() {
            // Form submissions
            document.getElementById('addFacultyForm').addEventListener('submit', handleAddFaculty);
            document.getElementById('editFacultyForm').addEventListener('submit', handleEditFaculty);
            
            // File input handlers
            document.getElementById('facultyImageFile').addEventListener('change', handleImageUpload);
            document.getElementById('editFacultyImageFile').addEventListener('change', handleEditImageUpload);
            
            // Modal close events
            window.addEventListener('click', function(event) {
                const modal = document.getElementById('editModal');
                if (event.target === modal) {
                    closeEditModal();
                }
            });
        }

        // GitHub Authentication
        async function authenticateGitHub() {
            const token = document.getElementById('githubToken').value.trim();
            const owner = document.getElementById('githubOwner').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            
            if (!token) {
                showStatus('Please enter a GitHub token', 'error');
                return;
            }
            
            if (!owner) {
                showStatus('Please enter repository owner', 'error');
                return;
            }
            
            if (!repo) {
                showStatus('Please enter repository name', 'error');
                return;
            }
            
            showLoading(true);
            githubToken = token;
            githubOwner = owner;
            githubRepo = repo;
            
            try {
                // Test authentication by checking if the repository exists
                const response = await fetch(`${GITHUB_API_BASE}/repos/${githubOwner}/${githubRepo}`, {
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('Repository not found. Please check the owner and repository name.');
                    } else if (response.status === 401) {
                        throw new Error('Invalid token or insufficient permissions.');
                    } else {
                        throw new Error(`Authentication failed: ${response.status}`);
                    }
                }
                
                // Try to load existing faculty data
                await loadFacultyFromGitHub();
                
                // Save credentials to localStorage
                localStorage.setItem('github_token', githubToken);
                localStorage.setItem('github_repo', githubRepo);
                localStorage.setItem('github_owner', githubOwner);
                
                // Show main interface
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('mainContent').style.display = 'grid';
                
                showStatus(`Successfully connected to ${githubOwner}/${githubRepo}`, 'success');
                renderFaculty();
                updateStatistics();
                
            } catch (error) {
                console.error('GitHub authentication error:', error);
                showStatus(`Authentication failed: ${error.message}`, 'error');
            }
            
            showLoading(false);
        }

        // Load credentials from localStorage
        function loadFromLocalStorage() {
            const token = localStorage.getItem('github_token');
            const repo = localStorage.getItem('github_repo');
            const owner = localStorage.getItem('github_owner');
            
            if (token && repo && owner) {
                githubToken = token;
                githubRepo = repo;
                githubOwner = owner;
                
                // Set values in form
                document.getElementById('githubToken').value = token;
                document.getElementById('githubOwner').value = owner;
                document.getElementById('githubRepo').value = repo;
                
                // Auto-connect if credentials exist
                loadFacultyFromGitHub().then(() => {
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'grid';
                    renderFaculty();
                    updateStatistics();
                    showStatus('Automatically connected to repository', 'success');
                }).catch((error) => {
                    console.error('Auto-connect failed:', error);
                    showStatus('Please re-authenticate', 'info');
                    // Keep the auth section visible
                });
            }
        }

        // Load faculty data from GitHub
        async function loadFacultyFromGitHub() {
            try {
                const response = await fetch(`${GITHUB_API_BASE}/repos/${githubOwner}/${githubRepo}/contents/${FACULTY_FILE_PATH}`, {
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (response.status === 404) {
                    // File doesn't exist, create it with empty array
                    facultyData = [];
                    await saveFacultyToGitHub();
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`Failed to load faculty data: ${response.status}`);
                }
                
                const fileData = await response.json();
                repoFileSha = fileData.sha;
                
                // Decode base64 content
                const content = atob(fileData.content);
                const jsonData = JSON.parse(content);
                
                // Handle different JSON structures
                if (Array.isArray(jsonData)) {
                    facultyData = jsonData;
                } else if (jsonData.faculty && Array.isArray(jsonData.faculty)) {
                    facultyData = jsonData.faculty;
                } else {
                    facultyData = [];
                }
                
            } catch (error) {
                console.error('Error loading faculty data:', error);
                if (error.message.includes('404')) {
                    facultyData = [];
                } else {
                    throw error;
                }
            }
        }

        // Save faculty data to GitHub
        async function saveFacultyToGitHub() {
            try {
                const jsonData = {
                    faculty: facultyData,
                    lastUpdated: new Date().toISOString()
                };
                const content = JSON.stringify(jsonData, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(content)));
                
                const payload = {
                    message: `Update faculty data - ${new Date().toISOString()}`,
                    content: encodedContent
                };
                
                // Include SHA if file exists
                if (repoFileSha) {
                    payload.sha = repoFileSha;
                }
                
                const response = await fetch(`${GITHUB_API_BASE}/repos/${githubOwner}/${githubRepo}/contents/${FACULTY_FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Failed to save data: ${response.status} - ${errorData.message || 'Unknown error'}`);
                }
                
                const result = await response.json();
                repoFileSha = result.content.sha;
                
                updateStatistics();
                showStatus('Faculty data saved to GitHub successfully!', 'success');
                
            } catch (error) {
                console.error('Error saving faculty data:', error);
                showStatus(`Failed to save data: ${error.message}`, 'error');
                throw error;
            }
        }

        // Handle adding new faculty member
        async function handleAddFaculty(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const imageFile = document.getElementById('facultyImageFile').files[0];
            
            let imageUrl = formData.get('facultyImage');
            
            // If file is uploaded, upload to GitHub first
            if (imageFile) {
                try {
                    showLoading(true);
                    imageUrl = await uploadImageToGitHub(imageFile);
                } catch (error) {
                    showStatus(`Failed to upload image: ${error.message}`, 'error');
                    showLoading(false);
                    return;
                }
            }

            // Process subjects
            const subjectsText = formData.get('facultySubjects');
            const subjects = subjectsText.split(',').map(s => s.trim()).filter(s => s.length > 0);
            
            const newFaculty = {
                name: formData.get('facultyName'),
                post: formData.get('facultyPost'),
                subjects: subjects,
                experience: formData.get('facultyExperience'),
                image: imageUrl || 'https://via.placeholder.com/120x120/667eea/white?text=Faculty'
            };
            
            facultyData.push(newFaculty);
            
            try {
                await saveFacultyToGitHub();
                renderFaculty();
                event.target.reset();
                document.getElementById('filePreview').innerHTML = '';
                showStatus('Faculty member added successfully!', 'success');
            } catch (error) {
                // Remove the faculty if save failed
                facultyData.pop();
                showStatus(`Failed to add faculty member: ${error.message}`, 'error');
            }
            
            showLoading(false);
        }

        // Handle editing faculty member
        async function handleEditFaculty(event) {
            event.preventDefault();
            
            const index = parseInt(document.getElementById('editFacultyIndex').value);
            const imageFile = document.getElementById('editFacultyImageFile').files[0];
            
            let imageUrl = document.getElementById('editFacultyImage').value;
            
            // If file is uploaded, upload to GitHub first
            if (imageFile) {
                try {
                    showLoading(true);
                    imageUrl = await uploadImageToGitHub(imageFile);
                } catch (error) {
                    showStatus(`Failed to upload image: ${error.message}`, 'error');
                    showLoading(false);
                    return;
                }
            }

            // Process subjects
            const subjectsText = document.getElementById('editFacultySubjects').value;
            const subjects = subjectsText.split(',').map(s => s.trim()).filter(s => s.length > 0);
            
            // Update faculty data
            facultyData[index] = {
                name: document.getElementById('editFacultyName').value,
                post: document.getElementById('editFacultyPost').value,
                subjects: subjects,
                experience: document.getElementById('editFacultyExperience').value,
                image: imageUrl || facultyData[index].image
            };
            
            try {
                await saveFacultyToGitHub();
                renderFaculty();
                closeEditModal();
                showStatus('Faculty member updated successfully!', 'success');
            } catch (error) {
                showStatus(`Failed to update faculty member: ${error.message}`, 'error');
            }
            
            showLoading(false);
        }

        // Upload image to GitHub
        async function uploadImageToGitHub(file) {
            const fileName = `images/faculty_${Date.now()}_${file.name}`;
            
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const content = e.target.result.split(',')[1]; // Remove data:image/... prefix
                        
                        const payload = {
                            message: `Upload faculty image: ${fileName}`,
                            content: content
                        };
                        
                        const response = await fetch(`${GITHUB_API_BASE}/repos/${githubOwner}/${githubRepo}/contents/${fileName}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${githubToken}`,
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                        
                        if (!response.ok) {
                            throw new Error(`Failed to upload image: ${response.status}`);
                        }
                        
                        const result = await response.json();
                        resolve(result.content.download_url);
                        
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // Handle image upload preview
        function handleImageUpload(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('filePreview');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `
                        <img src="${e.target.result}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 2px solid #667eea;">
                        <p style="margin-top: 10px; font-size: 14px; color: #666;">Preview: ${file.name}</p>
                    `;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        }

        // Handle edit image upload preview
        function handleEditImageUpload(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('editImagePreview');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `
                        <img src="${e.target.result}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 2px solid #667eea;">
                        <p style="margin-top: 10px; font-size: 14px; color: #666;">New preview: ${file.name}</p>
                    `;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        }

        // Render faculty list
        function renderFaculty() {
            const facultyList = document.getElementById('facultyList');
            const facultyCount = document.getElementById('facultyCount');
            
            facultyCount.textContent = facultyData.length;
            
            if (facultyData.length === 0) {
                facultyList.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #666;">
                        <i class="fas fa-users fa-3x" style="margin-bottom: 20px; opacity: 0.3;"></i>
                        <p style="font-size: 1.2em;">No faculty members added yet.</p>
                        <p>Add your first faculty member using the form on the left.</p>
                    </div>
                `;
                return;
            }
            
            facultyList.innerHTML = facultyData.map((faculty, index) => `
                <div class="faculty-card new-item">
                    <img src="${faculty.image}" alt="${faculty.name}" class="faculty-image" 
                         onerror="this.src='https://via.placeholder.com/120x120/667eea/white?text=Faculty'">
                    <div class="faculty-name">${faculty.name}</div>
                    <div class="faculty-post">${faculty.post}</div>
                    <div class="faculty-details">
                        <div class="faculty-subjects">
                            <strong>Subjects:</strong>
                            <div class="subjects-list">
                                ${faculty.subjects.map(subject => `<span class="subject-tag">${subject}</span>`).join('')}
                            </div>
                        </div>
                        <div class="faculty-experience">
                            <i class="fas fa-clock"></i> ${faculty.experience}
                        </div>
                    </div>
                    <div class="faculty-actions">
                        <button onclick="editFaculty(${index})" class="btn btn-warning btn-small">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button onclick="deleteFaculty(${index})" class="btn btn-danger btn-small">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Update last updated time
            document.getElementById('lastUpdated').textContent = `Last updated: ${new Date().toLocaleString()}`;
        }

        // Edit faculty member
        function editFaculty(index) {
            const faculty = facultyData[index];
            
            document.getElementById('editFacultyIndex').value = index;
            document.getElementById('editFacultyName').value = faculty.name;
            document.getElementById('editFacultyPost').value = faculty.post;
            document.getElementById('editFacultySubjects').value = faculty.subjects.join(', ');
            document.getElementById('editFacultyExperience').value = faculty.experience;
            document.getElementById('editFacultyImage').value = faculty.image;
            
            // Clear file input and preview
            document.getElementById('editFacultyImageFile').value = '';
            document.getElementById('editImagePreview').innerHTML = '';
            
            document.getElementById('editModal').style.display = 'block';
        }

        // Delete faculty member
        async function deleteFaculty(index) {
            const faculty = facultyData[index];
            
            if (confirm(`Are you sure you want to delete ${faculty.name}?`)) {
                showLoading(true);
                
                const backupFaculty = [...facultyData];
                facultyData.splice(index, 1);
                
                try {
                    await saveFacultyToGitHub();
                    renderFaculty();
                    showStatus('Faculty member deleted successfully!', 'success');
                } catch (error) {
                    // Restore data if save failed
                    facultyData = backupFaculty;
                    showStatus(`Failed to delete faculty member: ${error.message}`, 'error');
                }
                
                showLoading(false);
            }
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Sort faculty
        function sortFaculty(criteria) {
            if (criteria === 'name') {
                facultyData.sort((a, b) => a.name.localeCompare(b.name));
            } else if (criteria === 'experience') {
                facultyData.sort((a, b) => {
                    const aExp = parseInt(a.experience.match(/\d+/)?.[0] || 0);
                    const bExp = parseInt(b.experience.match(/\d+/)?.[0] || 0);
                    return bExp - aExp;
                });
            }
            
            renderFaculty();
            showStatus(`Faculty sorted by ${criteria}`, 'info');
        }

        // Clear all faculty
        async function clearAllFaculty() {
            if (confirm('Are you sure you want to delete all faculty members? This action cannot be undone.')) {
                showLoading(true);
                
                const backupFaculty = [...facultyData];
                facultyData = [];
                
                try {
                    await saveFacultyToGitHub();
                    renderFaculty();
                    showStatus('All faculty members cleared successfully!', 'success');
                } catch (error) {
                    // Restore data if save failed
                    facultyData = backupFaculty;
                    showStatus(`Failed to clear faculty data: ${error.message}`, 'error');
                }
                
                showLoading(false);
            }
        }

        // Refresh faculty data
        async function refreshFaculty() {
            showLoading(true);
            
            try {
                await loadFacultyFromGitHub();
                renderFaculty();
                updateStatistics();
                showStatus('Faculty data refreshed from GitHub!', 'success');
            } catch (error) {
                showStatus(`Failed to refresh data: ${error.message}`, 'error');
            }
            
            showLoading(false);
        }

        // Update statistics
        function updateStatistics() {
            const totalFaculty = facultyData.length;
            const allSubjects = new Set();
            let totalExperience = 0;
            
            facultyData.forEach(faculty => {
                faculty.subjects.forEach(subject => allSubjects.add(subject));
                const exp = parseInt(faculty.experience.match(/\d+/)?.[0] || 0);
                totalExperience += exp;
            });
            
            const avgExperience = totalFaculty > 0 ? Math.round(totalExperience / totalFaculty) : 0;
            
            document.getElementById('totalFaculty').textContent = totalFaculty;
            document.getElementById('totalSubjects').textContent = allSubjects.size;
            document.getElementById('avgExperience').textContent = avgExperience + ' yrs';
        }

        // Show preview
        function showPreview() {
            const previewSection = document.getElementById('previewSection');
            const previewContent = document.getElementById('previewContent');
            
            const htmlContent = generateFacultyHTML();
            previewContent.innerHTML = `<pre><code>${escapeHtml(htmlContent)}</code></pre>`;
            previewSection.style.display = 'block';
            previewSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Hide preview
        function hidePreview() {
            document.getElementById('previewSection').style.display = 'none';
        }

        // Generate faculty HTML
        function generateFacultyHTML() {
            const facultyCards = facultyData.map(faculty => `
        <div class="faculty-card">
            <img src="${faculty.image}" alt="${faculty.name}" class="faculty-image">
            <div class="faculty-name">${faculty.name}</div>
            <div class="faculty-post">${faculty.post}</div>
            <div class="faculty-details">
                <div class="faculty-subjects">
                    <strong>Subjects:</strong>
                    <div class="subjects-list">
                        ${faculty.subjects.map(subject => `<span class="subject-tag">${subject}</span>`).join('')}
                    </div>
                </div>
                <div class="faculty-experience">
                    <i class="fas fa-clock"></i> ${faculty.experience}
                </div>
            </div>
        </div>`).join('\n');

            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty - Our School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Add your CSS styles here */
        .faculty-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .faculty-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .faculty-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
        }
        /* Add more styles as needed */
    </style>
</head>
<body>
    <div class="container">
        <h1>Our Faculty</h1>
        <div class="faculty-grid">
${facultyCards}
        </div>
    </div>
</body>
</html>`;
        }

        // Export faculty HTML
        function exportFacultyHTML() {
            const htmlContent = generateFacultyHTML();
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'faculty.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus('Faculty HTML file downloaded successfully!', 'success');
        }

        // Utility functions
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message status-${type}`;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
